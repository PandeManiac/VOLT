name: CI

# Feature work enters through pull requests. The integration branches are
# long-lived targets, so a pull request into one of them is verified too.
# Pushes are verified on master and on those integration branches, where a
# direct push has no pull-request run behind it. The concurrency group is
# keyed by the branch, so a superseded run on the same branch is cancelled
# instead of doubling the work.
on:
  push:
    branches:
      - master
      - feat/gameplay-events-ability-tasks
  pull_request:
    branches:
      - master
      - feat/gameplay-events-ability-tasks
  workflow_dispatch:
    inputs:
      gpu_validation:
        description: Run optional GPU-backed Vulkan validation on a registered vulkan-gpu runner
        required: true
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build, test, format, and demo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Volt.slnx

      - name: Build
        run: dotnet build Volt.slnx -c Release --no-restore

      # Native Vulkan integration tests are opt-in through
      # VOLT_VULKAN_INTEGRATION=1 and require a Vulkan device. Hosted
      # runners have the loader but no device, so those tests report as
      # skipped here; everything else, including the device-independent
      # Vulkan unit tests, runs. See tools/README.md for the GPU-backed
      # headless harness used for the opt-in path.
      - name: Test
        run: dotnet test Volt.slnx -c Release --no-restore

      - name: Test documentation tooling
        run: python3 tools/tests/test-compare-editor-docs.py

      - name: Test benchmark tooling
        run: |
          python3 tools/tests/test-compare-benchmark-runs.py
          python3 tools/tests/test-benchmark-trend.py

      # The guides open with contents lists; a renamed section must not
      # silently leave a dead anchor or an unlisted heading behind.
      - name: Verify document contents
        run: python3 tools/tests/test-doc-contents.py

      # The editor guide's screenshots are captured headlessly and
      # compared with a per-channel and pixel tolerance, so harmless
      # platform antialiasing drift does not fail the build while a
      # stale image does.
      - name: Verify documentation screenshots
        run: ./tools/capture-editor-docs.sh --check --no-build

      - name: Verify formatting
        run: dotnet format Volt.slnx --verify-no-changes --severity warn

      - name: Run the gameplay demo
        run: dotnet run --project samples/Volt.GameplayDemo -c Release --no-restore

  # The panel refreshes four times a second, so a regression in its
  # steady path would slow every editor session. The comparison uses a
  # wide ratio because a hosted runner is shared and varies between runs;
  # a collapsed path still fails. The baseline is the previous successful
  # hosted run when its artifact is available, so the means are judged
  # within one machine class; the committed run is the fallback.
  # The two paths are also compared with each other: three available
  # hosted quotients are 1.77, 1.82, and 1.87. That is too little
  # evidence to tighten the 2.2 limit safely; the extra margin allows
  # for variation on shared runners until more reports accumulate.
  ecs-refresh-benchmark:
    name: ECS refresh benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Volt.slnx

      - name: Record the refresh benchmark
        run: OUTPUT_DIR="$RUNNER_TEMP/ecs-refresh" ./tools/benchmark-ecs-refresh.sh

      # The means differ between machine classes while the quotient does
      # not, so a hosted run is judged against the last successful hosted
      # run when one left its artifact behind. The committed run is the
      # fallback for the first run after this step, or an expired artifact.
      - name: Choose the baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          baseline=tools/benchmark-results/ecs-refresh-2026-10-30/BenchmarkRun.txt
          run_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=master&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')

          if [ -n "$run_id" ] \
            && gh run download "$run_id" --name ecs-refresh-benchmark \
              --dir "$RUNNER_TEMP/previous"; then
            found=$(find "$RUNNER_TEMP/previous" -name BenchmarkRun.txt -print -quit)

            if [ -n "$found" ]; then
              baseline=$found
            fi
          fi

          if [ "$baseline" = tools/benchmark-results/ecs-refresh-2026-10-30/BenchmarkRun.txt ]; then
            source="the committed run, because no hosted artifact was available"
          else
            source="the previous hosted run"
          fi

          printf 'BASELINE=%s\n' "$baseline" >> "$GITHUB_ENV"
          printf 'BASELINE_SOURCE=%s\n' "$source" >> "$GITHUB_ENV"
          printf 'Comparing against %s (%s)\n' "$baseline" "$source"

      # The table also goes into the job summary, so a reviewer can see
      # which baseline was used without opening the log. The step still
      # fails with the comparison's own status.
      - name: Compare with the recorded baseline
        run: |
          set -uo pipefail

          source="${BASELINE_SOURCE:-the chosen baseline}"

          output=$(python3 tools/compare-benchmark-runs.py \
            --baseline "$BASELINE" \
            --current "$RUNNER_TEMP/ecs-refresh/BenchmarkRun.txt" \
            --job ShortRun \
            --max-ratio 2.0 \
            --overhead RebuildingRefresh:SteadyRefresh \
            --max-overhead 2.2 2>&1)
          status=$?

          python3 tools/compare-benchmark-runs.py \
            --baseline "$BASELINE" \
            --current "$RUNNER_TEMP/ecs-refresh/BenchmarkRun.txt" \
            --job ShortRun \
            --max-ratio 2.0 \
            --overhead RebuildingRefresh:SteadyRefresh \
            --max-overhead 2.2 \
            --json > "$RUNNER_TEMP/ecs-refresh/comparison.json"
          json_status=$?

          if [ "$json_status" -ne 0 ]; then
            printf 'JSON report generation failed with status %d\n' "$json_status" >&2
            status=$json_status
          fi

          printf '%s\n' "$output"

          {
            printf '### ECS refresh benchmark\n\n'
            printf 'Baseline: `%s` from %s.\n\n' "$BASELINE" "$source"
            printf '```\n'
            printf '%s\n' "$output"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

          exit $status

      # The hosted means differ from the committed baseline by more
      # than the ratio does, so keep the run itself: a later change
      # can be compared against what that machine actually measured.
      # always() keeps it on a failed comparison, where the numbers
      # matter most.
      - name: Keep the recorded run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecs-refresh-benchmark
          path: ${{ runner.temp }}/ecs-refresh/BenchmarkRun.txt

      - name: Keep the JSON comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecs-refresh-comparison-json
          path: ${{ runner.temp }}/ecs-refresh/comparison.json

  # Hardware validation is a deliberately requested workflow run, not a
  # dependency of ordinary pushes. A missing self-hosted GPU runner must not
  # leave normal CI queued indefinitely.
  vulkan-gpu:
    name: GPU-backed Vulkan validation
    if: github.event_name == 'workflow_dispatch' && inputs.gpu_validation == true
    needs: build-test
    runs-on: [self-hosted, linux, vulkan-gpu]
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Volt.slnx

      - name: Build the Vulkan mesh demo
        run: dotnet build samples/Volt.VulkanMeshDemo -c Release --no-restore

      - name: Run headless Vulkan validation
        run: >-
          ./tools/test-vulkan-headless.sh
          --project samples/Volt.VulkanMeshDemo
          --frames 600
          --validation
          --screenshots
          --expect-clusters 3
